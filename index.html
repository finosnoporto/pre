<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <link rel="icon" type="image/png" href="logo_site.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finos no Porto</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-QRLRD1YYF1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-QRLRD1YYF1');
  </script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="">
  <style>
    :root{
      --brand-red:#7b1727;
      --brand-red-dark:#54101b;
      --brand-gold:#d8b15e;
      --brand-gold-dark:#c39a43;
      --brand-cream:#faf5e9;
      --brand-cream-deep:#f3ead7;
      --brand-text:#302326;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
    body{display:flex;flex-direction:column}

    /* Cabeçalho com inspiração vínica/vermelho e dourado; mapa e pop-ups ficam inalterados. */
    header{
      padding:17px 20px 16px;
      background:linear-gradient(135deg,var(--brand-red) 0%,var(--brand-red-dark) 100%);
      color:#fff;
      border-bottom:4px solid var(--brand-gold);
      flex-shrink:0;
      text-align:center;
    }
    header h1{margin:0;font-size:25px;line-height:1.2;letter-spacing:.2px;color:#fff}
    header p{margin:7px 0 0;color:#f8ead1;font-size:14px;line-height:1.4}

    /* Os dois controlos principais ficam na mesma linha, também em ecrãs móveis. */
    .top-actions{
      display:flex;align-items:stretch;gap:10px;
      padding:10px 16px 12px;
      background:var(--brand-cream);
      flex-shrink:0;
    }
    .filter-toggle,.submit-bar-toggle{
      display:flex;flex:1;min-width:0;justify-content:center;
      padding:0;background:transparent;flex-shrink:1;
    }
    .filter-button{
      width:100%;max-width:none;min-height:42px;
      border:1px solid var(--brand-red);border-radius:10px;
      padding:9px 12px;background:var(--brand-red);color:#fff;
      font-size:14px;font-weight:700;cursor:pointer;
      box-shadow:0 2px 4px rgba(84,16,27,.12);
      transition:background .15s ease,transform .15s ease;
    }
    .filter-button:hover{background:var(--brand-red-dark)}
    .filter-button:active,.submit-bar-button:active{transform:translateY(1px)}
    .filter-button:focus-visible,.submit-bar-button:focus-visible,.reset-button:focus-visible{outline:3px solid var(--brand-gold);outline-offset:2px}

    .filters{
      display:none;gap:10px;flex-wrap:wrap;justify-content:center;align-items:flex-end;
      padding:12px 16px;background:#fffaf1;border-bottom:1px solid #e4d4b0;flex-shrink:0;
    }
    .filters.open{display:flex}
    .filter-group{display:flex;flex-direction:column;gap:5px}
    .filter-group label{font-size:12px;color:var(--brand-text);font-weight:700}
    .filter-group input,.filter-group select,.reset-button{
      height:40px;border:1px solid #d8c9ac;border-radius:8px;padding:0 10px;
      background:#fff;color:#292323;font-size:14px;
    }
    .filter-group input{width:150px}
    .filter-group select{min-width:170px}
    .filter-group input:focus,.filter-group select:focus,.submit-group input:focus,.submit-group select:focus{
      outline:2px solid var(--brand-gold);outline-offset:1px;border-color:var(--brand-red);
    }
    .reset-button{margin-top:auto;cursor:pointer;background:var(--brand-cream);border-color:var(--brand-red);color:var(--brand-red);font-weight:700;padding:0 14px}
    .reset-button:hover{background:var(--brand-cream-deep)}

    .status{padding:9px 16px;background:#fff3cd;color:#664d03;font-size:14px;border-bottom:1px solid #ddd;flex-shrink:0}
    .status.error{background:#f8d7da;color:#842029}
    .hidden{display:none}
    #map{width:100%;flex:1;min-height:0}

    /* Estilos dos pop-ups preservados. */
    .popup-title{font-weight:bold;font-size:17px;margin-bottom:8px}
    .popup-price{font-size:20px;font-weight:bold;margin-bottom:5px}
    .popup-info{color:#555;font-size:14px;margin-bottom:4px}
    .popup-updated{color:#777;font-size:12px;margin-top:8px}
    .popup-map-link{display:block;margin-top:12px;padding-top:12px;border-top:1px solid #eee;color:#1a73e8;font-size:13px;font-weight:600;text-decoration:none}
    .popup-map-link:hover{text-decoration:underline}
    .feedback{margin-top:13px;padding-top:12px;border-top:1px solid #eee}
    .feedback-question{font-size:13px;font-weight:600;color:#333;margin-bottom:9px}
    .feedback-buttons{display:flex;gap:8px}
    .feedback-button{flex:1;height:34px;border:1px solid #ccc;border-radius:7px;background:#fff;font-size:13px;font-weight:600;cursor:pointer}
    .feedback-button:hover{background:#f5f5f5}
    .feedback-form{display:none;margin-top:9px}
    .feedback-form.open{display:grid;grid-template-columns:1fr 1fr;gap:7px}
    .feedback-input{grid-column:1/-1;width:100%;height:34px;border:1px solid #ccc;border-radius:7px;padding:0 9px;font-size:13px}
    .feedback-select{width:100%;height:34px;border:1px solid #ccc;border-radius:7px;background:#fff;padding:0 8px;font-size:13px}
    .feedback-send{width:100%;height:34px;border:1px solid #ccc;border-radius:7px;background:#222;color:#fff;padding:0 12px;font-size:13px;font-weight:600;cursor:pointer}
    .feedback-send:disabled{opacity:.6;cursor:not-allowed}
    .feedback-message{display:none;margin-top:9px;font-size:12px;color:#555;font-weight:600}
    .feedback-message.visible{display:block}
    .leaflet-popup-content-wrapper{border-radius:12px}
    .leaflet-popup-content{margin:14px;max-width:280px}
    .price-marker{position:relative;width:58px;height:72px}
    .price-label{position:absolute;top:0;left:50%;transform:translateX(-50%);background:#fff;border:1px solid #bbb;border-radius:6px;padding:4px 7px;font-size:12px;font-weight:700;color:#222;white-space:nowrap;box-shadow:0 2px 5px rgba(0,0,0,.2);z-index:2}
    .price-label:after{content:'';position:absolute;bottom:-5px;left:50%;width:8px;height:8px;background:#fff;border-right:1px solid #bbb;border-bottom:1px solid #bbb;transform:translateX(-50%) rotate(45deg)}
    .blue-pin{position:absolute;width:25px;height:41px;left:50%;bottom:0;transform:translateX(-50%);z-index:1}

    .submit-bar-button{
      width:100%;max-width:none;min-height:42px;
      border:1px solid var(--brand-gold-dark);border-radius:10px;
      padding:9px 16px;background:var(--brand-gold);color:var(--brand-red-dark);
      font-size:15px;font-weight:700;cursor:pointer;
      box-shadow:0 2px 4px rgba(84,16,27,.09);
      transition:background .15s ease,transform .15s ease;
    }
    .submit-bar-button:hover{background:var(--brand-gold-dark)}
    .submit-bar-form{
      display:none;gap:10px;flex-wrap:wrap;justify-content:center;
      padding:13px 16px;background:#fffaf1;border-bottom:1px solid #e4d4b0;flex-shrink:0;
    }
    .submit-bar-form.open{display:flex}
    .submit-bar-form .form-title{width:100%;font-size:16px;font-weight:700;color:var(--brand-red-dark);text-align:center;margin-bottom:2px}
    .submit-bar-form .form-help{width:100%;font-size:12px;color:#6d6260;text-align:center;margin-bottom:2px}
    .submit-group{display:flex;flex-direction:column;gap:5px}
    .submit-group label{font-size:12px;color:var(--brand-text);font-weight:700}
    .submit-group input,.submit-group select{height:40px;border:1px solid #d8c9ac;border-radius:8px;padding:0 10px;background:#fff;font-size:14px}
    .submit-group input{width:180px}
    .submit-group select{min-width:180px}
    .submit-actions{display:flex;gap:8px;align-items:flex-end}
    .submit-send,.submit-cancel{min-height:40px;border:1px solid #ccc;border-radius:8px;padding:0 14px;font-size:14px;font-weight:700;cursor:pointer}
    .submit-send{background:var(--brand-red);border-color:var(--brand-red);color:#fff}
    .submit-send:hover{background:var(--brand-red-dark)}
    .submit-cancel{background:#fff;border-color:#d8c9ac;color:var(--brand-text)}
    .submit-cancel:hover{background:var(--brand-cream-deep)}
    .submit-message{width:100%;font-size:13px;font-weight:600;color:#555;text-align:center}

    @media(max-width:600px){
      header{padding:15px 12px 14px}
      header h1{font-size:22px;line-height:1.25}
      header p{font-size:13px;margin-top:6px}
      .top-actions{gap:8px;padding:8px 10px 10px}
      .filter-button,.submit-bar-button{max-width:none;min-height:44px;font-size:13px;padding:8px 5px}
      .filters{padding:10px 12px;gap:9px}
      .filter-group{flex:1;min-width:calc(50% - 5px)}
      .filter-group input,.filter-group select{width:100%;min-width:0}
      .reset-button{width:100%;height:40px;margin-top:1px}
      .leaflet-popup-content{width:calc(100vw - 70px)!important;max-width:245px!important;margin:10px}
      .popup-title{font-size:15px;margin-bottom:6px}
      .popup-price{font-size:18px;margin-bottom:4px}
      .popup-info{font-size:12px;margin-bottom:3px}
      .popup-updated{font-size:11px;margin-top:7px}
      .popup-map-link{font-size:12px;margin-top:10px;padding-top:10px}
      .feedback-question{font-size:12px}
      .feedback-button{font-size:12px}
      .feedback-input{font-size:12px}
      .feedback-send{font-size:12px}
      .price-label{font-size:11px;padding:3px 6px}
      .submit-bar-form{padding:11px 12px;gap:9px}
      .submit-group{flex:1;min-width:calc(50% - 5px)}
      .submit-group input,.submit-group select{width:100%;min-width:0}
      .submit-actions{width:100%}
      .submit-send,.submit-cancel{flex:1;min-height:42px}
      .submit-bar-form .form-title,.submit-bar-form .form-help{max-width:100%}
    }

    @media(max-width:360px){
      .top-actions{gap:6px;padding-left:8px;padding-right:8px}
      .filter-button,.submit-bar-button{font-size:12px;padding-left:3px;padding-right:3px}
    }

    @media(prefers-reduced-motion:reduce){
      .filter-button,.submit-bar-button{transition:none}
    }
  </style>
</head>
<body>
  <header>
    <h1>Finos no Porto</h1>
    <p>Encontra e compara finos no Porto</p>
  </header>

  <div class="top-actions">
    <div class="filter-toggle">
      <button id="mostrarFiltros" class="filter-button" type="button" aria-expanded="false">Filtros</button>
    </div>
    <div class="submit-bar-toggle">
      <button id="mostrarSubmissao" class="submit-bar-button" type="button" aria-expanded="false">Adicionar novo bar</button>
    </div>
  </div>

  <div id="filters" class="filters">
    <div class="filter-group">
      <label for="precoMax">Preço máximo</label>
      <input id="precoMax" type="number" min="0" step="0.10" placeholder="Ex.: 1,50">
    </div>
    <div class="filter-group">
      <label for="zona">Zona</label>
      <select id="zona">
        <option value="">Todas as zonas</option>
      </select>
    </div>
    <button id="limparFiltros" class="reset-button" type="button">Limpar filtros</button>
  </div>


  <form id="submitBarForm" class="submit-bar-form">
    <div class="form-title">Adicionar um bar</div>
    <div class="form-help">Preenche os dados abaixo. A submissão será verificada antes de aparecer no mapa.</div>

    <div class="submit-group">
      <label for="novoNomeBar">Nome do bar</label>
      <input id="novoNomeBar" type="text" maxlength="150" required>
    </div>

    <div class="submit-group">
      <label for="novaMarca">Marca</label>
      <input id="novaMarca" type="text" maxlength="100" required>
    </div>

    <div class="submit-group">
      <label for="novoPreco">Preço do fino (€)</label>
      <input id="novoPreco" type="number" min="0.01" step="0.01" placeholder="Ex.: 1,50" required>
    </div>

    <div class="submit-group">
      <label for="novoTamanho">Tamanho do fino</label>
      <select id="novoTamanho" required>
        <option value="">Selecionar tamanho</option>
        <option value="20">20 cl</option>
        <option value="25">25 cl</option>
        <option value="35">35 cl</option>
      </select>
    </div>

    <div class="submit-group">
      <label for="novaZona">Zona</label>
      <select id="novaZona" required>
        <option value="">Selecionar zona</option>
      </select>
    </div>

    <div class="submit-actions">
      <button class="submit-cancel" id="cancelarSubmissao" type="button">Cancelar</button>
      <button class="submit-send" id="enviarSubmissao" type="submit">Enviar</button>
    </div>

    <div id="submitMessage" class="submit-message"></div>
  </form>

  <div id="status" class="status">A carregar os bares...</div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>

  <script>
    // Google Analytics 4 está inicializado no <head>; esta função regista eventos personalizados.
    function registarEventoAnalytics(nomeEvento, parametros={}){
      if(typeof window.gtag!=='function')return;
      window.gtag('event',nomeEvento,parametros);
    }

    const API_URL='https://script.google.com/macros/s/AKfycbxP-5Ibk9MRKdGRNYnXNwdgPwOzi1XUlR4ccm7CGtxHudJsKzRznWniCgN6Ugx-C-4ZiQ/exec';
    const map=L.map('map').setView([41.1579,-8.6291],13);

    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:19,
      attribution:'&copy; OpenStreetMap contributors'
    }).addTo(map);

    const statusElement=document.getElementById('status');
    const precoMaxElement=document.getElementById('precoMax');
    const zonaElement=document.getElementById('zona');
    const limparFiltrosElement=document.getElementById('limparFiltros');
    const mostrarFiltrosElement=document.getElementById('mostrarFiltros');
    const filtersElement=document.getElementById('filters');

    const mostrarSubmissaoElement=document.getElementById('mostrarSubmissao');
    const submitBarFormElement=document.getElementById('submitBarForm');
    const cancelarSubmissaoElement=document.getElementById('cancelarSubmissao');
    const enviarSubmissaoElement=document.getElementById('enviarSubmissao');
    const submitMessageElement=document.getElementById('submitMessage');
    const novoNomeBarElement=document.getElementById('novoNomeBar');
    const novaMarcaElement=document.getElementById('novaMarca');
    const novoPrecoElement=document.getElementById('novoPreco');
    const novoTamanhoElement=document.getElementById('novoTamanho');
    const novaZonaElement=document.getElementById('novaZona');


    let todosOsBares=[];
    let markersLayer=L.layerGroup().addTo(map);

    function escapeHtml(value){
      if(value===null||value===undefined)return '';
      return String(value)
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
    }

    function toFiniteNumberOrNull(value){
      if(value===null||value===undefined)return null;

      if(typeof value==='string'){
        const text=value.trim();
        if(text==='')return null;
        value=text.replace(',','.');
      }

      const number=Number(value);
      return Number.isFinite(number)?number:null;
    }

    function formatPrice(price){
      const number=toFiniteNumberOrNull(price);
      if(number===null)return 'Preço não disponível';
      return number.toLocaleString('pt-PT',{
        style:'currency',
        currency:'EUR'
      });
    }

    function formatPricePerLiter(price){
      const number=toFiniteNumberOrNull(price);
      if(number===null||number<=0)return '';
      return number.toLocaleString('pt-PT',{
        style:'currency',
        currency:'EUR'
      })+'/L';
    }

    function parseDateValue(dateValue){
      if(!dateValue)return null;

      const text=String(dateValue).trim();
      const dateOnlyMatch=text.match(/^(\d{4})-(\d{2})-(\d{2})$/);

      if(dateOnlyMatch){
        const year=Number(dateOnlyMatch[1]);
        const month=Number(dateOnlyMatch[2]);
        const day=Number(dateOnlyMatch[3]);
        const localDate=new Date(year,month-1,day);

        if(
          localDate.getFullYear()!==year||
          localDate.getMonth()!==month-1||
          localDate.getDate()!==day
        ){
          return null;
        }

        return localDate;
      }

      const parsed=new Date(text);
      return Number.isNaN(parsed.getTime())?null:parsed;
    }

    function daysSince(dateValue){
      const date=parseDateValue(dateValue);
      if(!date)return null;

      // Comparamos dias de calendário locais, evitando problemas de UTC/DST.
      const targetDay=new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
      );

      const now=new Date();
      const today=new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      );

      return Math.round(
        (today.getTime()-targetDay.getTime())/(1000*60*60*24)
      );
    }

    function formatUpdatedText(dateValue){
      const days=daysSince(dateValue);
      if(days===null)return 'Data de atualização desconhecida';
      if(days<0)return 'Atualização futura';
      if(days===0)return 'Atualizado hoje';
      if(days===1)return 'Atualizado há 1 dia';
      return `Atualizado há ${days} dias`;
    }

    function createPriceIcon(price){
      const number=toFiniteNumberOrNull(price);
      const text=number===null
        ? '—'
        : number.toLocaleString('pt-PT',{
            style:'currency',
            currency:'EUR',
            minimumFractionDigits:2
          });

      return L.divIcon({
        className:'',
        html:`
          <div class="price-marker">
            <div class="price-label">${text}</div>
            <img class="blue-pin"
              src="https://unpkg.com/leaflet@1.9.4/dist/images/marker-icon.png"
              alt="">
          </div>
        `,
        iconSize:[58,72],
        iconAnchor:[29,72],
        popupAnchor:[0,-72]
      });
    }

    function createGoogleMapsUrl(bar){
      const placeId=String(bar.google_place_id||'').trim();
      const nome=String(bar.nome||'').trim();

      if(!placeId)return '';

      const query=encodeURIComponent(nome||'Porto');

      return `https://www.google.com/maps/search/?api=1&query=${query}&query_place_id=${encodeURIComponent(placeId)}`;
    }

    async function enviarFeedback(barId,tamanho,tipo,precoReportado=null){
      const inicioPedido=performance.now();
      const params=new URLSearchParams();
      params.append('bar_id',String(barId));
      params.append('tamanho_cl',String(tamanho));
      params.append('tipo',tipo);

      if(precoReportado!==null){
        params.append('preco_reportado',String(precoReportado));
      }

      try{
        const response=await fetch(API_URL,{
          method:'POST',
          body:params
        });

        if(!response.ok){
          throw new Error(`Erro HTTP ${response.status}`);
        }

        const data=await response.json();

        if(!data.sucesso){
          throw new Error(data.erro||'Não foi possível enviar o feedback.');
        }

        const duracaoMs=Math.round(performance.now()-inicioPedido);
        console.info(`[Finos no Porto] Feedback "${tipo}" concluído em ${duracaoMs} ms.`);
        registarEventoAnalytics('feedback_request_completed',{
          feedback_type:tipo,
          duration_ms:duracaoMs,
          tamanho_cl:Number(tamanho)
        });

        return data;
      }catch(error){
        const duracaoMs=Math.round(performance.now()-inicioPedido);
        console.warn(`[Finos no Porto] Feedback "${tipo}" falhou após ${duracaoMs} ms.`,error);
        registarEventoAnalytics('feedback_request_failed',{
          feedback_type:tipo,
          duration_ms:duracaoMs,
          tamanho_cl:Number(tamanho)
        });
        throw error;
      }
    }

    function configurarFeedback(popupElement,bar,marker){
      const feedback=popupElement.querySelector('.feedback');
      if(!feedback)return;

      const yesButton=feedback.querySelector('.feedback-yes');
      const noButton=feedback.querySelector('.feedback-no');
      const form=feedback.querySelector('.feedback-form');
      const input=feedback.querySelector('.feedback-input');
      const tamanhoSelect=feedback.querySelector('.feedback-select');
      const sendButton=feedback.querySelector('.feedback-send');
      const message=feedback.querySelector('.feedback-message');

      function mostrarMensagem(texto){
        message.textContent=texto;
        message.classList.add('visible');
      }

      function fecharPopupAutomaticamente(){
        setTimeout(()=>{
          marker.closePopup();
        },2000);
      }

      yesButton.addEventListener('click',async()=>{
        yesButton.disabled=true;
        noButton.disabled=true;
        mostrarMensagem('A enviar confirmação...');

        try{
          await enviarFeedback(
            bar.bar_id,
            Number(bar.tamanho_cl),
            'confirmacao'
          );

          mostrarMensagem('✓ Obrigado! Preço confirmado.');
          registarEventoAnalytics('price_confirmed',{bar_id:String(bar.bar_id),tamanho_cl:Number(bar.tamanho_cl)});

          bar.atualizado_em=new Date().toString();
          popupElement.querySelector('.popup-updated').textContent='Atualizado hoje';

          fecharPopupAutomaticamente();
        }catch(error){
          console.error('Erro ao confirmar preço:',error);
          yesButton.disabled=false;
          noButton.disabled=false;
          mostrarMensagem('Não foi possível enviar. Tenta novamente.');
        }
      });

      noButton.addEventListener('click',()=>{
        registarEventoAnalytics('price_correction_form_opened',{bar_id:String(bar.bar_id)});
        noButton.disabled=true;
        form.classList.add('open');
        input.focus();
      });

      sendButton.addEventListener('click',async()=>{
        const preco=input.value.replace(',','.');
        const valor=Number(preco);
        const tamanho=Number(tamanhoSelect.value);

        if(!Number.isFinite(valor)||valor<=0){
          input.focus();
          return;
        }

        if(![20,25,35].includes(tamanho)){
          tamanhoSelect.focus();
          return;
        }

        sendButton.disabled=true;
        input.disabled=true;
        tamanhoSelect.disabled=true;
        mostrarMensagem('A enviar correção...');

        try{
          await enviarFeedback(
            bar.bar_id,
            tamanho,
            'alteracao',
            valor
          );

          yesButton.disabled=true;
          noButton.disabled=true;
          form.classList.remove('open');

          mostrarMensagem('✓ Obrigado! Vamos verificar o novo preço.');
          registarEventoAnalytics('price_correction_sent',{bar_id:String(bar.bar_id),tamanho_cl:tamanho});

          fecharPopupAutomaticamente();
        }catch(error){
          console.error('Erro ao enviar alteração:',error);
          sendButton.disabled=false;
          input.disabled=false;
          tamanhoSelect.disabled=false;
          mostrarMensagem('Não foi possível enviar. Tenta novamente.');
        }
      });

      input.addEventListener('keydown',event=>{
        if(event.key==='Enter'){
          sendButton.click();
        }
      });
    }

    function createPopupContent(bar){
      const nome=escapeHtml(bar.nome);
      const marca=escapeHtml(bar.marca_cerveja);
      const zona=escapeHtml(bar.zona);
      const preco=formatPrice(bar.preco_fino);
      const tamanho=toFiniteNumberOrNull(bar.tamanho_cl);
      const tamanhoTexto=tamanho===null ? 'Tamanho não disponível' : `${tamanho} cl`;
      const precoLitro=formatPricePerLiter(bar.preco_litro);
      const atualizado=formatUpdatedText(bar.atualizado_em);
      const googleMapsUrl=createGoogleMapsUrl(bar);

      return `
        <div class="popup">
          <div class="popup-title">${nome}</div>
          <div class="popup-price">${preco}</div>
          <div class="popup-info">${tamanhoTexto} · ${marca}</div>
          <div class="popup-info">${precoLitro}</div>
          <div class="popup-info">${zona}</div>
          <div class="popup-updated">${atualizado}</div>

          ${googleMapsUrl
            ? `<a class="popup-map-link" href="${googleMapsUrl}" target="_blank" rel="noopener noreferrer">Ver no Google Maps →</a>`
            : ''
          }

          <div class="feedback">
            <div class="feedback-question">O preço está correto?</div>
            <div class="feedback-buttons">
              <button class="feedback-button feedback-yes" type="button">Sim</button>
              <button class="feedback-button feedback-no" type="button">Não</button>
            </div>

            <div class="feedback-form">
              <input class="feedback-input" type="number" min="0.01" step="0.01" placeholder="Novo preço">
              <select class="feedback-select" aria-label="Tamanho do fino">
                <option value="">Tamanho</option>
                <option value="20" ${tamanho===20?'selected':''}>20 cl</option>
                <option value="25" ${tamanho===25?'selected':''}>25 cl</option>
                <option value="35" ${tamanho===35?'selected':''}>35 cl</option>
              </select>
              <button class="feedback-send" type="button">Enviar</button>
            </div>

            <div class="feedback-message"></div>
          </div>
        </div>
      `;
    }

    function preencherZonas(){
      const zonas=[...new Set(
        todosOsBares
          .map(bar=>String(bar.zona||'').trim())
          .filter(Boolean)
      )].sort((a,b)=>a.localeCompare(b,'pt'));

      zonaElement.innerHTML='<option value="">Todas as zonas</option>';

      zonas.forEach(zona=>{
        const option=document.createElement('option');
        option.value=zona;
        option.textContent=zona;
        zonaElement.appendChild(option);

        const submitOption=document.createElement('option');
        submitOption.value=zona;
        submitOption.textContent=zona;
        novaZonaElement.appendChild(submitOption);
      });
    }

    function obterBaresFiltrados(){
      const precoMaxTexto=precoMaxElement.value.replace(',','.');
      const precoMax=precoMaxTexto===''?null:Number(precoMaxTexto);
      const zonaSelecionada=zonaElement.value;

      return todosOsBares.filter(bar=>{
        const preco=toFiniteNumberOrNull(bar.preco_fino);

        if(precoMax!==null&&Number.isFinite(precoMax)){
          // Bares sem preço não entram num filtro de preço máximo.
          if(preco===null||preco>precoMax)return false;
        }

        if(zonaSelecionada&&String(bar.zona)!==zonaSelecionada){
          return false;
        }

        return true;
      });
    }

    function mostrarBares(){
      markersLayer.clearLayers();

      const baresFiltrados=obterBaresFiltrados();
      const markers=[];

      baresFiltrados.forEach(bar=>{
        const latitude=Number(bar.latitude);
        const longitude=Number(bar.longitude);

        if(!Number.isFinite(latitude)||!Number.isFinite(longitude))return;

        const marker=L.marker(
          [latitude,longitude],
          {icon:createPriceIcon(bar.preco_fino)}
        );

        marker.bindPopup(createPopupContent(bar));

        marker.on('popupopen',event=>{
          const popupElement=event.popup.getElement();

          if(popupElement){
            registarEventoAnalytics('bar_details_view',{bar_id:String(bar.bar_id),zona:String(bar.zona||'')});

            const mapLink=popupElement.querySelector('.popup-map-link');
            if(mapLink&&mapLink.dataset.analyticsBound!=='true'){
              mapLink.dataset.analyticsBound='true';
              mapLink.addEventListener('click',()=>{
                registarEventoAnalytics('google_maps_click',{bar_id:String(bar.bar_id),zona:String(bar.zona||'')});
              });
            }

            configurarFeedback(popupElement,bar,marker);
          }
        });

        marker.addTo(markersLayer);
        markers.push(marker);
      });

      if(markers.length>0){
        const group=L.featureGroup(markers);
        map.fitBounds(group.getBounds(),{
          padding:[40,40],
          maxZoom:15
        });
      }else{
        map.setView([41.1579,-8.6291],13);
      }

      statusElement.classList.remove('error','hidden');
      statusElement.textContent=
        baresFiltrados.length===1
          ? '1 bar encontrado'
          : `${baresFiltrados.length} bares encontrados`;

      setTimeout(()=>{
        statusElement.classList.add('hidden');
      },1500);
    }


    async function enviarNovaSubmissao(event){
      event.preventDefault();

      const nome=novoNomeBarElement.value.trim();
      const marca=novaMarcaElement.value.trim();
      const precoTexto=novoPrecoElement.value.replace(',','.').trim();
      const preco=Number(precoTexto);
      const tamanho=Number(novoTamanhoElement.value);
      const zona=novaZonaElement.value.trim();

      if(!nome||!marca||!zona||!Number.isFinite(preco)||preco<=0||![20,25,35].includes(tamanho)){
        submitMessageElement.textContent='Preenche todos os campos corretamente.';
        return;
      }

      enviarSubmissaoElement.disabled=true;
      cancelarSubmissaoElement.disabled=true;
      submitMessageElement.textContent='A enviar...';

      try{
        const params=new URLSearchParams();
        params.append('acao','submissao');
        params.append('nome_bar',nome);
        params.append('marca_reportada',marca);
        params.append('preco_reportado',String(preco));
        params.append('tamanho_cl',String(tamanho));
        params.append('zona',zona);

        const response=await fetch(API_URL,{
          method:'POST',
          body:params
        });

        if(!response.ok){
          throw new Error(`Erro HTTP ${response.status}`);
        }

        const data=await response.json();

        if(!data.sucesso){
          throw new Error(data.erro||'Não foi possível enviar a submissão.');
        }

        submitMessageElement.textContent='✓ Obrigado! A submissão foi enviada para verificação.';
        registarEventoAnalytics('bar_submission_sent',{zona:zona,tamanho_cl:tamanho});
        submitBarFormElement.reset();

        setTimeout(()=>{
          fecharFormularioSubmissao();
        },2500);
      }catch(error){
        console.error('Erro ao enviar nova submissão:',error);
        submitMessageElement.textContent='Não foi possível enviar. Tenta novamente.';
      }finally{
        enviarSubmissaoElement.disabled=false;
        cancelarSubmissaoElement.disabled=false;
      }
    }

    function fecharFormularioSubmissao(){
      submitBarFormElement.classList.remove('open');
      mostrarSubmissaoElement.setAttribute('aria-expanded','false');
      mostrarSubmissaoElement.textContent='Adicionar novo bar';
      submitMessageElement.textContent='';
      submitBarFormElement.reset();
    }

    async function carregarBares(){
      // performance.now() mede o tempo desde o início da navegação da página.
      let inicioPedidoApi=null;
      let tempoApiMs=null;
      let tempoMapaMs=null;
      let numeroBaresRecebidos=0;

      try{
        statusElement.classList.remove('error','hidden');
        statusElement.textContent='A carregar os bares...';

        inicioPedidoApi=performance.now();
        const response=await fetch(API_URL);

        if(!response.ok){
          throw new Error(`Erro HTTP ${response.status}`);
        }

        const data=await response.json();
        tempoApiMs=performance.now()-inicioPedidoApi;

        if(!data.sucesso){
          throw new Error(data.erro||'A API devolveu um erro.');
        }

        if(!Array.isArray(data.bares)){
          throw new Error('A resposta da API não contém uma lista de bares.');
        }

        todosOsBares=data.bares;
        numeroBaresRecebidos=todosOsBares.length;

        const inicioRenderizacaoMapa=performance.now();
        preencherZonas();
        mostrarBares();
        tempoMapaMs=performance.now()-inicioRenderizacaoMapa;

        // O total é contado desde o início da navegação até os bares estarem
        // recebidos, processados e adicionados ao mapa.
        const metricasCarregamento={
          tempo_total_ms:Math.round(performance.now()),
          tempo_api_ms:Math.round(tempoApiMs),
          tempo_mapa_ms:Math.round(tempoMapaMs),
          bares_recebidos:numeroBaresRecebidos
        };

        console.info('[Finos no Porto] Medição do carregamento inicial dos bares:',metricasCarregamento);
        registarEventoAnalytics('bars_initial_load_complete',{
          load_time_ms:metricasCarregamento.tempo_total_ms,
          api_time_ms:metricasCarregamento.tempo_api_ms,
          map_render_time_ms:metricasCarregamento.tempo_mapa_ms,
          bars_received_count:numeroBaresRecebidos
        });

        console.log('Dados recebidos da API:',data);
      }catch(error){
        const tempoTotalFalhaMs=Math.round(performance.now());
        if(inicioPedidoApi!==null&&tempoApiMs===null){
          tempoApiMs=performance.now()-inicioPedidoApi;
        }

        console.error(`[Finos no Porto] Falha no carregamento inicial após ${tempoTotalFalhaMs} ms.`,error);
        const parametrosFalha={load_time_ms:tempoTotalFalhaMs};
        if(tempoApiMs!==null){
          parametrosFalha.api_time_ms=Math.round(tempoApiMs);
        }
        registarEventoAnalytics('bars_initial_load_failed',parametrosFalha);

        statusElement.classList.remove('hidden');
        statusElement.classList.add('error');
        statusElement.textContent='Não foi possível carregar os bares. Verifica a ligação à API.';
      }
    }


    mostrarSubmissaoElement.addEventListener('click',()=>{
      const aberto=submitBarFormElement.classList.toggle('open');
      mostrarSubmissaoElement.setAttribute('aria-expanded',aberto);
      mostrarSubmissaoElement.textContent=aberto?'Fechar formulário':'Adicionar novo bar';
      if(aberto){
        registarEventoAnalytics('bar_submission_form_opened');
        setTimeout(()=>novoNomeBarElement.focus(),50);
      }
    });

    cancelarSubmissaoElement.addEventListener('click',fecharFormularioSubmissao);
    submitBarFormElement.addEventListener('submit',enviarNovaSubmissao);

    mostrarFiltrosElement.addEventListener('click',()=>{
      const aberto=filtersElement.classList.toggle('open');
      mostrarFiltrosElement.setAttribute('aria-expanded',aberto);
      mostrarFiltrosElement.textContent=aberto?'Fechar filtros':'Filtros';
      if(aberto)registarEventoAnalytics('filters_panel_opened');
      setTimeout(()=>map.invalidateSize(),50);
    });

    precoMaxElement.addEventListener('input',mostrarBares);
    precoMaxElement.addEventListener('change',()=>{
      const texto=precoMaxElement.value.trim().replace(',','.');
      const valor=Number(texto);
      if(texto!==''&&Number.isFinite(valor)&&valor>=0){
        registarEventoAnalytics('filter_price_used',{preco_maximo:valor});
      }
    });

    zonaElement.addEventListener('change',()=>{
      if(zonaElement.value){
        registarEventoAnalytics('filter_zone_used',{zona:zonaElement.value});
      }
      mostrarBares();
    });

    limparFiltrosElement.addEventListener('click',()=>{
      const tinhaFiltros=precoMaxElement.value!==''||zonaElement.value!=='';
      precoMaxElement.value='';
      zonaElement.value='';
      if(tinhaFiltros)registarEventoAnalytics('filters_cleared');
      mostrarBares();
    });

    carregarBares();
  </script>
</body>
</html>
